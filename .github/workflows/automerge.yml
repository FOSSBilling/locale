name: automerge
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  status: {}
jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for bot PRs
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          for pr in $(gh pr list --author fossbilling-bot --state open --json number --jq '.[].number'); do
            gh pr merge "$pr" --auto --squash || true
          done
