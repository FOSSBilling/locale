name: Automated Compilation of Translations

permissions:
  contents: read

# Serialize .mo/release runs: concurrent pushes would race on the direct
# push to main below.
concurrency:
  group: generate-mo
  cancel-in-progress: false

on:
  push:
    branches: main
    paths-ignore:
      - "**/*.mo"
      - "messages.pot"
  # Manual recovery lever, e.g. to rebuild translations if a push event is ever missed.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write
    name: Compile to .mo
    steps:
      - name: Load Secrets from 1Password
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # GitHub - FOSSBilling Automation App secrets stored in 1Password.
          AUTOMATION_APP_CLIENT_ID: op://mkqkefntgcmjlgyxzeaekzuuvq/ts64rykikbva7zplnf5woxx3bi/client-id
          AUTOMATION_APP_PRIVATE_KEY: op://mkqkefntgcmjlgyxzeaekzuuvq/ts64rykikbva7zplnf5woxx3bi/private-key

      - name: Generate Automation Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.load-secrets.outputs.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Get Automation App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install gettext -y

      - name: Generate .mo Files
        run: |
          for po_file in $(find . -name "*.po"); do
            dirname=$(dirname $po_file)
            filename=$(basename $po_file .po)
            msgfmt $po_file -o "$dirname/$filename.mo"
          done

      - name: Add .mo Files to Git
        run: git add .

      - name: Commit and Push .mo Files
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Automated .mo File Generation"
          git push

      - name: Create Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: translations
          path: |
            ./**/messages.mo
            ./**/messages.po
            locales.php
            LICENSE.md
            messages.pot
            README.md

  release:
    name: Publish to Release
    runs-on: ubuntu-slim
    timeout-minutes: 15
    needs: build
    permissions:
      contents: write
    steps:
      - name: Load Secrets from 1Password
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # GitHub - FOSSBilling Automation App secrets stored in 1Password.
          AUTOMATION_APP_CLIENT_ID: op://mkqkefntgcmjlgyxzeaekzuuvq/ts64rykikbva7zplnf5woxx3bi/client-id
          AUTOMATION_APP_PRIVATE_KEY: op://mkqkefntgcmjlgyxzeaekzuuvq/ts64rykikbva7zplnf5woxx3bi/private-key

      - name: Generate Automation Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.load-secrets.outputs.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Download the Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: translations

      - name: Calculate the Translation Tag (messages.pot hash)
        working-directory: translations
        # Prefixed tag: GitHub rejects bare 40/64-char hex strings as tag
        # names (ambiguous with object IDs), so the raw hash alone fails.
        # The display name keeps the bare hash; only the tag needs the prefix.
        run: |
          HASH=$(sha256sum messages.pot | cut -d' ' -f1)
          echo "TRANSLATION_HASH=$HASH" >> $GITHUB_ENV
          echo "TRANSLATION_TAG=pot-$HASH" >> $GITHUB_ENV

      - name: Display Structure of Downloaded Files
        run: ls -R

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install gettext -y

      - name: Remove Translations with Low Completion
        working-directory: translations
        run: |
          now=$(date)
          echo "## FOSSBilling Translations" >> translations.md
          echo "Dated: $now" >> translations.md
          echo "Translation Tag: [$TRANSLATION_TAG](https://github.com/FOSSBilling/locale/releases/tag/$TRANSLATION_TAG)" >> translations.md

          rm -f messages.pot

          # Create an associative array to store completion percentages
          declare -A completion_array

          for po_file in $(find . -name "*.po"); do
            dirname=$(dirname "$po_file")
            translation=$(dirname "$dirname")

            # Use msgfmt to generate temporary file with statistics
            msgfmt --statistics "$po_file" >/tmp/msgfmt_stats.tmp 2>&1

            # Capture the statistics output
            statistics=$(cat /tmp/msgfmt_stats.tmp)

            # Remove the temporary file
            rm /tmp/msgfmt_stats.tmp

            # Extract the number of translated and total messages
            translated_messages=$(echo "$statistics" | awk -F ',' '{print $1}' | awk '{print $1}')
            untranslated_messages=$(echo "$statistics" | awk -F ',' '{print $2}' | awk '{print $1}')
            total_messages=$((translated_messages + untranslated_messages))

            # Calculate completion percentage
            if [ -n "$translated_messages" ] && [ -n "$total_messages" ]; then
              completion_percentage=$((translated_messages * 100 / total_messages))
            else
              completion_percentage=0
            fi

            completeBars=$(($completion_percentage / 10))
            incompleteBars=$((10 - $completeBars))
            bar=""
            for ((i = 0; i < completeBars; i++)); do
              bar+="▰"
            done
            for ((i = 0; i < incompleteBars; i++)); do
              bar+="▱"
            done
            
            # If the translation is less than 25% complete, delete it entirely. Otherwise, just remove the source file to make things cleaner
            if [ "$completion_percentage" -lt 25 ] && [ "$dirname" != "./en_US/LC_MESSAGES" ]; then
              rm -rf "$translation"

              translation=${translation#./}
              completion_array["$translation"]=$completion_percentage
              echo " - \`$translation\`: $bar $completion_percentage% translated (excluded, too incomplete)" >>translations.md
            else
              if [ "$dirname" != "./en_US/LC_MESSAGES" ]; then
                translation=${translation#./}
                echo " - \`$translation\`: $bar $completion_percentage% translated" >>translations.md
                completion_array["$translation"]=$completion_percentage
              fi
              rm -f "$dirname/messages.po"
            fi
          done

          # Create a PHP file with the completion percentages
          echo '<?php' > completion.php

          echo '/**' >> completion.php
          echo ' * FOSSBilling Translations' >> completion.php
          echo " * Dated: $now" >> completion.php
          echo ' * License: https://github.com/FOSSBilling/locale/blob/main/LICENSE.md' >> completion.php
          echo ' */' >> completion.php

          echo 'return [' >> completion.php
          for locale in "${!completion_array[@]}"; do
            percentage=${completion_array[$locale]}
            echo "  '$locale' => $percentage," >> completion.php
          done

          echo '];' >> completion.php

          rm -f messages.mo

      - name: Create a zip of the Translations
        run: zip -r ./translations.zip .
        working-directory: translations

      - name: Release to GitHub
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # No checkout in this job, so gh cannot infer the repo from git.
          GH_REPO: ${{ github.repository }}
        # Recreate the release so assets and notes always reflect this run.
        run: |
          gh release delete "$TRANSLATION_TAG" --yes --cleanup-tag || true
          gh release create "$TRANSLATION_TAG" translations/translations.zip \
            --target main \
            --title "Translations ($TRANSLATION_HASH)" \
            --notes-file translations/translations.md
