name: Update Translation Template

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Mondays at 06:00 UTC
  workflow_dispatch:
    inputs:
      source_ref:
        description: FOSSBilling ref to extract from (for testing extractor changes)
        default: main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-pot
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate messages.pot
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.regen.outputs.changed }}
    steps:
      - name: Checkout locale Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: locale

      - name: Checkout FOSSBilling Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: FOSSBilling/FOSSBilling
          ref: ${{ inputs.source_ref || 'main' }}
          path: fossbilling
          sparse-checkout: |
            /src/
            /.github/scripts/extract_pot.py
          sparse-checkout-cone-mode: false

      - name: Regenerate messages.pot
        id: regen
        run: |
          python3 fossbilling/.github/scripts/extract_pot.py fossbilling/src /tmp/messages.pot.new
          python3 fossbilling/.github/scripts/extract_pot.py --diff locale/messages.pot /tmp/messages.pot.new > /tmp/pot-diff.txt 2>&1 || true
          cat /tmp/pot-diff.txt
          # Compare msgid sets, not bytes: POT-Creation-Date always differs.
          if python3 -c "
          import sys; sys.path.insert(0, 'fossbilling/.github/scripts')
          from extract_pot import parse_pot_entries
          sys.exit(0 if parse_pot_entries('locale/messages.pot') == parse_pot_entries('/tmp/messages.pot.new') else 1)
          "; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mkdir -p pot-update
            cp /tmp/messages.pot.new pot-update/messages.pot.new
            cp /tmp/pot-diff.txt pot-update/pot-diff.txt
          fi

      - name: Upload Regenerated Template
        if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: messages-pot-update
          if-no-files-found: error
          retention-days: 1
          path: |
            pot-update/messages.pot.new
            pot-update/pot-diff.txt

  publish:
    name: Open Update PR
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Load Secrets from 1Password
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # GitHub - FOSSBilling Automation App secrets stored in 1Password.
          AUTOMATION_APP_CLIENT_ID: op://mkqkefntgcmjlgyxzeaekzuuvq/ts64rykikbva7zplnf5woxx3bi/client-id
          AUTOMATION_APP_PRIVATE_KEY: op://mkqkefntgcmjlgyxzeaekzuuvq/ts64rykikbva7zplnf5woxx3bi/private-key
          
      - name: Generate Automation Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.load-secrets.outputs.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get Automation App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download Regenerated Template
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: messages-pot-update
          path: pot-update

      - name: Open Update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          REF="${{ inputs.source_ref || 'main' }}"
          if [ "$REF" = "main" ]; then
            # Scheduled refresh: reset the automation-owned branch to current main
            # so a still-open PR is refreshed in place instead of duplicated.
            BRANCH="automation/messages-pot"
            TITLE="Regenerate messages.pot from source"
            UPDATE_EXISTING=true
            git fetch origin main "$BRANCH" || true
            git checkout -B "$BRANCH" origin/main
          else
            # Test dispatch from another ref: isolated throwaway branch so
            # experimental output can never hijack the scheduled PR.
            SAFE_REF=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9_.-' '-')
            BRANCH="automation/messages-pot-test-${SAFE_REF}-r${{ github.run_number }}"
            TITLE="[test] Regenerate messages.pot from $REF"
            UPDATE_EXISTING=false
            git checkout -b "$BRANCH"
          fi
          cp pot-update/messages.pot.new messages.pot
          git add messages.pot
          git -c user.name="${APP_SLUG}[bot]" -c user.email="${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "Regenerate messages.pot from FOSSBilling source ($REF)"
          if [ "$UPDATE_EXISTING" = true ]; then
            git push --force-with-lease -u origin "$BRANCH"
          else
            git push -u origin "$BRANCH"
          fi
          {
            echo "Regenerated \`messages.pot\` from \`FOSSBilling/FOSSBilling@${{ inputs.source_ref || 'main' }}\` using \`extract_pot.py\`."
            echo ""
            echo "Review the msgid delta before merging — casing-only changes invalidate existing translations:"
            echo ""
            echo '```'
            head -n 250 pot-update/pot-diff.txt
            echo '```'
            echo ""
            echo "_Full diff truncated to 250 lines; counts above are complete._"
          } > /tmp/pr-body.md
          EXISTING=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ] && [ "$UPDATE_EXISTING" = true ]; then
            gh pr edit "$EXISTING" --body-file /tmp/pr-body.md
          else
            gh pr create --title "$TITLE" --body-file /tmp/pr-body.md
          fi
