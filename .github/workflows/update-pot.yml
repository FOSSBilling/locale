name: Update Translation Template

# Weekly refresh of messages.pot from FOSSBilling source. Opens a review PR
# on change; never pushes to main directly.

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Mondays at 06:00 UTC
  workflow_dispatch:
    inputs:
      source_ref:
        description: FOSSBilling ref to extract from (for testing extractor changes)
        default: main
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pot
  cancel-in-progress: false

jobs:
  update-pot:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout locale Repo
        uses: actions/checkout@v7
        with:
          path: locale

      - name: Checkout FOSSBilling Source
        uses: actions/checkout@v7
        with:
          repository: FOSSBilling/FOSSBilling
          ref: ${{ inputs.source_ref || 'main' }}
          path: fossbilling
          sparse-checkout: src
          sparse-checkout-cone-mode: false

      - name: Regenerate messages.pot
        id: regen
        run: |
          python3 fossbilling/.github/scripts/extract_pot.py fossbilling/src locale/messages.pot.new
          python3 fossbilling/.github/scripts/extract_pot.py --diff locale/messages.pot locale/messages.pot.new > /tmp/pot-diff.txt 2>&1 || true
          cat /tmp/pot-diff.txt
          # Compare msgid sets, not bytes: POT-Creation-Date always differs.
          if python3 -c "
          import sys; sys.path.insert(0, 'fossbilling/.github/scripts')
          from extract_pot import parse_pot_entries
          sys.exit(0 if parse_pot_entries('locale/messages.pot') == parse_pot_entries('locale/messages.pot.new') else 1)
          "; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm locale/messages.pot.new
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mv locale/messages.pot.new locale/messages.pot
          fi

      - name: Open Update PR
        if: steps.regen.outputs.changed == 'true'
        working-directory: locale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bot/messages-pot-$(date -u +%Y%m%d)-r${{ github.run_number }}"
          git checkout -b "$BRANCH"
          git add messages.pot
          git -c user.name="FOSSBilling Bot" -c user.email="bot@fossbilling.org" \
            commit -m "Regenerate messages.pot from FOSSBilling/main"
          git push -u origin "$BRANCH"
          {
            echo "Regenerated \`messages.pot\` from \`FOSSBilling/FOSSBilling@${{ inputs.source_ref || 'main' }}\` using \`extract_pot.py\`."
            echo ""
            echo "Review the msgid delta before merging — casing-only changes invalidate existing translations:"
            echo ""
            echo '```'
            head -n 250 /tmp/pot-diff.txt
            echo '```'
            echo ""
            echo "_Full diff truncated to 250 lines; counts above are complete._"
          } > /tmp/pr-body.md
          gh pr create --title "Regenerate messages.pot from source" --body-file /tmp/pr-body.md
