name: Update Translation Template

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-pot
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate messages.pot
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.regen.outputs.changed }}
      gone: ${{ steps.regen.outputs.gone }}
      max_gone: ${{ steps.regen.outputs.max_gone }}
      large_removal: ${{ steps.regen.outputs.large_removal }}
    steps:
      - name: Checkout locale Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: locale

      - name: Checkout FOSSBilling Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: FOSSBilling/FOSSBilling
          ref: main
          path: fossbilling
          sparse-checkout: |
            /src/
            /tools/i18n/
          sparse-checkout-cone-mode: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer:v2
          coverage: none

      - name: Install Translation Tooling
        run: composer install --working-dir=fossbilling/tools/i18n --no-dev --no-interaction --no-progress

      - name: Regenerate messages.pot
        id: regen
        run: |
          fossbilling/tools/i18n/bin/console extract fossbilling/src /tmp/messages.pot.new
          fossbilling/tools/i18n/bin/console diff locale/messages.pot /tmp/messages.pot.new --format=json > /tmp/pot-diff.json
          jq -er '.report' /tmp/pot-diff.json > /tmp/pot-diff.txt
          cat /tmp/pot-diff.txt
          # Flag destructive regens for mandatory human review (see #682).
          MAX_GONE=15
          jq -er --argjson max "$MAX_GONE" '
            select((.changed | type) == "boolean" and (.gone | type) == "number") |
            "changed=\(.changed)\ngone=\(.gone)\nmax_gone=\($max)\nlarge_removal=\(.gone > $max)"
          ' /tmp/pot-diff.json >> "$GITHUB_OUTPUT"
          if jq -e '.changed' /tmp/pot-diff.json > /dev/null; then
            mkdir -p pot-update
            cp /tmp/messages.pot.new pot-update/messages.pot.new
            cp /tmp/pot-diff.txt pot-update/pot-diff.txt
          fi

      - name: Upload Regenerated Template
        if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: messages-pot-update
          if-no-files-found: error
          retention-days: 1
          path: |
            pot-update/messages.pot.new
            pot-update/pot-diff.txt

  publish:
    name: Open Update PR
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Load Secrets from 1Password
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # GitHub - FOSSBilling Automation App secrets stored in 1Password.
          AUTOMATION_APP_CLIENT_ID: op://mkqkefntgcmjlgyxzeaekzuuvq/ts64rykikbva7zplnf5woxx3bi/client-id
          AUTOMATION_APP_PRIVATE_KEY: op://mkqkefntgcmjlgyxzeaekzuuvq/ts64rykikbva7zplnf5woxx3bi/private-key

      - name: Generate Automation Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ steps.load-secrets.outputs.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get Automation App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download Regenerated Template
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: messages-pot-update
          path: pot-update

      - name: Open Update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          # Reset the automation-owned branch to current main so a still-open
          # PR is refreshed in place instead of duplicated.
          BRANCH="automation/messages-pot"
          TITLE="Regenerate messages.pot from source"
          MAX_GONE="${{ needs.generate.outputs.max_gone }}"
          GONE="${{ needs.generate.outputs.gone }}"
          LARGE_REMOVAL="${{ needs.generate.outputs.large_removal }}"
          git fetch origin main "$BRANCH" || true
          git checkout -B "$BRANCH" origin/main
          cp pot-update/messages.pot.new messages.pot
          git add messages.pot
          git -c user.name="${APP_SLUG}[bot]" -c user.email="${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "Regenerate messages.pot from FOSSBilling source (main)"
          git push --force-with-lease -u origin "$BRANCH"
          {
            echo "Regenerated \`messages.pot\` from \`FOSSBilling/FOSSBilling@main\` using \`tools/i18n/bin/console extract\`."
            echo ""
            if [ "$LARGE_REMOVAL" = "true" ]; then
              echo "> ⚠️ **Large removal alert:** this regen drops **${GONE}** msgids (threshold: ${MAX_GONE}). Do not merge until every dropped msgid is verified against FOSSBilling source — an extractor bug can silently delete live strings (see #682)."
              echo ""
            fi
            echo "Review the msgid delta before merging — casing-only changes invalidate existing translations:"
            echo ""
            echo '```'
            DIFF_TAIL="_Full diff truncated to 250 lines; counts above are complete._"
            if [ "$LARGE_REMOVAL" = "true" ]; then
              # Cap the in-body diff: GitHub rejects bodies over 65,536
              # characters, which a catastrophic regen could exceed.
              BODY_BUDGET=50000
              DIFF_SIZE=$(wc -c < pot-update/pot-diff.txt | tr -d ' ')
              if [ "$DIFF_SIZE" -gt "$BODY_BUDGET" ]; then
                head -c "$BODY_BUDGET" pot-update/pot-diff.txt
                echo ""
                echo "[... diff truncated at 50 KB — full text is in this run's artifacts ...]"
                DIFF_TAIL="_Diff capped for the PR body — review every dropped msgid before merging._"
              else
                cat pot-update/pot-diff.txt
                DIFF_TAIL="_Full diff included above — review every dropped msgid before merging._"
              fi
            else
              head -n 250 pot-update/pot-diff.txt
            fi
            echo '```'
            echo ""
            echo "$DIFF_TAIL"
          } > /tmp/pr-body.md
          EXISTING=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          # Labels go on before the body write: if the body submit ever
          # fails, a destructive update is still flagged instead of sitting
          # force-pushed with a stale body and no label.
          if [ -n "$EXISTING" ]; then
            PR="$EXISTING"
            if [ "$LARGE_REMOVAL" = "true" ]; then
              gh pr edit "$PR" --add-label needs-review
            else
              # Best-effort: the label is absent on a normal regen, and only
              # cosmetic either way — the PR body above is the real record.
              gh pr edit "$PR" --remove-label needs-review || true
            fi
            gh pr edit "$PR" --body-file /tmp/pr-body.md
          else
            if [ "$LARGE_REMOVAL" = "true" ]; then
              PR=$(gh pr create --title "$TITLE" --body-file /tmp/pr-body.md --label needs-review)
            else
              PR=$(gh pr create --title "$TITLE" --body-file /tmp/pr-body.md)
            fi
          fi
